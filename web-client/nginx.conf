server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve service names per request, so the console starts even when the others are not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $service http://transfer-service:8080;
  set $mockbank http://mock-bank:9090;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Server-sent events: no buffering, long-lived connection.
  location = /api/v1/transfers/events {
    proxy_pass $service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Batch: stream the upload and the results.
  location = /api/v1/transfers/batch {
    proxy_pass $service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 10m;
    client_max_body_size 20m;
  }

  location /api/ {
    proxy_pass $service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  location = /actuator/health {
    proxy_pass $service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 10s;
  }

  # Mock bank admin API and services, without the /mock prefix.
  location /mock/ {
    rewrite ^/mock/(.*)$ /$1 break;
    proxy_pass $mockbank;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
